name: StaticLayersAPI deploy action (prod)

on:
  push:
    branches:
      - feature-actions
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: edc-prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build
        uses: ./.github/workflows/composite
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          vpc-id: ${{ secrets.VPC_ID }}
          subnet-ids: ${{ secrets.SUBNET_IDS }}
          security-group: ${{ secrets.SECURITY_GROUP}}
          stack-id: CdkStaticLayersStack
          role-name: ${{ secrets.OIDC_ROLE_NAME }}
