name: StaticLayersAPI deploy action (test)

on:
  push:
    branches:
      - feature-actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build
        uses: ./.github/workflows/composite
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          stack-id: CdkStaticLayersStack
